
name: SafarSaathi CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Verify build tools
        run: |
          java -version
          mvn -version

      - name: Build and install common module
        run: |
          mvn --batch-mode --no-transfer-progress \
            -f common-module/pom.xml clean install

      - name: Build and test all microservices
        shell: bash
        run: |
          set -euo pipefail

          for service in \
            discovery-server \
            auth-service \
            user-service \
            trip-service \
            companion-service \
            notification-service \
            ai-service \
            api-gateway
          do
            echo "========================================"
            echo "Building and testing: ${service}"
            echo "========================================"

            mvn --batch-mode --no-transfer-progress \
              -f "${service}/pom.xml" clean verify
          done

  publish-images:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: verify

    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        (
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'
        )
      }}

    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - auth-service
          - user-service
          - trip-service
          - companion-service
          - notification-service
          - ai-service
          - api-gateway

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/safarsaathi-${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

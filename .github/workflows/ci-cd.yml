name: SafarSaathi CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint/dockerless@v1
        with:
          reporter: github-pr-check
          fail_level: error

  verify:
    name: Build and test backend
    runs-on: ubuntu-latest

    # Temporary database for automated CI tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # These values are only for the disposable CI environment.
    # Never use these test credentials in a real deployment.
    env:
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ci-only-password

      CLOUDINARY_CLOUD_NAME: ci-test
      CLOUDINARY_API_KEY: ci-test
      CLOUDINARY_API_SECRET: ci-test

      OPENCAGE_API_KEY: ci-test
      GEMINI_API_KEY: ci-test

      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Verify build tools
        run: |
          java -version
          mvn -version

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Create test databases
        shell: bash
        run: |
          set -euo pipefail

          for database in \
            safar_userdb \
            safar_tripdb \
            safar_companiondb \
            safar_notificationdb \
            ai_service_db
          do
            echo "Creating test database: ${database}"

            PGPASSWORD="${PGPASSWORD:-ci-only-password}" \
              psql \
                -h localhost \
                -p 5432 \
                -U postgres \
                -d postgres \
                -v ON_ERROR_STOP=1 \
                -c "CREATE DATABASE ${database};"
          done
        env:
          PGPASSWORD: ci-only-password

      - name: Build and install common module
        run: |
          mvn --batch-mode --no-transfer-progress \
            -f common-module/pom.xml clean install

      - name: Build and test all microservices
        shell: bash
        run: |
          set -euo pipefail

          for service in \
            discovery-server \
            auth-service \
            user-service \
            trip-service \
            companion-service \
            notification-service \
            ai-service \
            api-gateway
          do
            echo "========================================"
            echo "Building and testing: ${service}"
            echo "========================================"

            mvn --batch-mode --no-transfer-progress \
              -f "${service}/pom.xml" clean verify
          done

  publish-images:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [lint-workflows, verify]

    # Publish images only after CI passes on main.
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        (
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'
        )
      }}

    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - auth-service
          - user-service
          - trip-service
          - companion-service
          - notification-service
          - ai-service
          - api-gateway

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/safarsaathi-${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

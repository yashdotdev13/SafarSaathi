apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-service
  namespace: safarsaathi

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-service

  template:
    metadata:
      labels:
        app: ai-service

    spec:
      containers:
        - name: ai-service

          image: yash01er/safarsaathi-ai-service:1.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8086

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker

            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-service-secret
                  key: GEMINI_API_KEY

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 60
            periodSeconds: 20